{{$prefix := .Prefix}}
<!DOCTYPE html>
<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <title>Admin Site</title>
 
    <link rel="stylesheet" id="iconlib-link" href="{{$prefix}}/static/admin.css">   
  <style id="theme-default"></style><style id="theme-html"></style></head>
  <body>

    <article>
      <aside>
        <nav>
          <h2>Structs</h2>
          <input id="filter" placeholder="Search..."></input>
          <ul id="filter_list">
            {{range .Structs}}
            <li><a href="{{$prefix}}/edit/{{.Name}}">{{.Display}}</a></li>
            {{end}}
          </ul>
 
          <h2>Functions</h2>
          <ul>
            {{range .Funcs}}
            <li>
              <form action="{{$prefix}}/call/{{.}}" method="Post">
                <input type="Submit" value="{{.}}">
              </form>
            </li>
            {{end}}
          </ul>
        </nav>
      </aside>
      <main>
            {{ if .Form}}
            <form  method="POST">
              {{.Form}}
              <br>
              <input type="submit" value="Save"/>
            </form>
            {{ end }}
            {{ if .Deleteable }}
            <form action="{{$prefix}}/delete/{{.Name}}" method="Post" 
               onSubmit="return confirm('Are you sure you want to delete this?  No going back.')">
              <input type="submit" value="🗑 Delete"/>
            </form>
            {{ end }}

            {{ if .Status}}
              <p>{{.Status}}</p>
            {{ end }}
      </main>
    </article>

    <script type="text/javascript">

    function filter_list() {
        let input = document.getElementById('filter');
        let filter = input.value.toUpperCase();
        let list = document.getElementById('filter_list');
        let lis = list.getElementsByTagName('li')
        for (let i = 0; i < lis.length; i++) {
            let text = lis[i].children[0].innerHTML;
            if (text.toUpperCase().indexOf(filter) >= 0) {
                lis[i].style.display = 'list-item';
            } else {
                lis[i].style.display = 'none';
            }
        }
    }
    document.getElementById('filter').onkeyup = filter_list;
    filter_list();
    </script>

</body></html>
